# Pinned tools for homelab GitOps work; installed into /opt/mise at build time.
[settings]
system_installs_dir = "/opt/mise/installs"
system_shims_dir = "/opt/mise/shims"

[tools]
age = "1.3.2"
flux2 = "2.9.6"
gh = "2.103.2"
helm = "4.3.1"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
sops = "3.13.3"
yq = "4.54.1"
